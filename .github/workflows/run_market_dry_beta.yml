name: Run Market Dry Run Operational Beta
on:
  push:
    branches: [main]
    paths:
      - scripts/run_market.py
      - scripts/market_preflight.py
      - scripts/run_market_dry_beta.py
      - .github/workflows/run_market.yml
      - .github/workflows/run_market_dry_beta.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Published-episode dry run and live protection
        env:
          DRY_RUN: ${{ secrets.DRY_RYN || secrets.DRY_RUN || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.run_market_dry_beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-market-dry-beta-${{ github.sha }}
          path: output/run-market-dry-beta/
          if-no-files-found: error
          retention-days: 14
