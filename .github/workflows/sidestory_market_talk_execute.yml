name: Market Talk common worker
on:
  workflow_call:
    inputs:
      stage:
        type: string
        default: automate
      mode:
        type: string
        default: normal
      live:
        type: boolean
        default: false
      revision:
        type: string
        default: ''
      slot_date:
        type: string
        default: ''
      confirm:
        type: string
        default: ''
      review_note:
        type: string
        default: ''
      post_id:
        type: string
        default: ''
      not_posted:
        type: boolean
        default: false
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_KEY:
        required: true
      FACE_PAGE_ID:
        required: true
      FACE_PAGE_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
      MARKET_TALK_LIVE: ${{ vars.MARKET_TALK_LIVE || 'false' }}
      MARKET_TALK_AUTO_ENABLED: ${{ vars.MARKET_TALK_AUTO_ENABLED || 'false' }}
      MARKET_TALK_SCHEDULE_ENABLED: ${{ vars.MARKET_TALK_SCHEDULE_ENABLED || 'false' }}
      MARKET_TALK_WATCHDOG_AUTO_RECOVERY_ENABLED: ${{ vars.MARKET_TALK_WATCHDOG_AUTO_RECOVERY_ENABLED || 'false' }}
      MARKET_TALK_CHARACTER_IDS: ${{ vars.MARKET_TALK_CHARACTER_IDS }}
      MARKET_TALK_MODEL: ${{ vars.MARKET_TALK_MODEL }}
      MARKET_TALK_INPUT_USD_PER_MTOK: ${{ vars.MARKET_TALK_INPUT_USD_PER_MTOK || '0' }}
      MARKET_TALK_OUTPUT_USD_PER_MTOK: ${{ vars.MARKET_TALK_OUTPUT_USD_PER_MTOK || '0' }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r sidestory/market_talk/requirements.lock
      - name: Execute exact bounded operation
        env:
          STAGE: ${{ inputs.stage }}
          MODE: ${{ inputs.mode }}
          LIVE_REQUEST: ${{ inputs.live && github.ref == 'refs/heads/main' }}
          REVISION: ${{ inputs.revision }}
          SLOT_DATE: ${{ inputs.slot_date }}
          CONFIRM: ${{ inputs.confirm }}
          NOTE: ${{ inputs.review_note }}
          POST_ID: ${{ inputs.post_id }}
          NOT_POSTED: ${{ inputs.not_posted }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          case "$STAGE" in
            automate|publish|verify)
              args=(--mode "$MODE" --output output/market-talk-report.json)
              if [[ "$STAGE" == verify ]]; then args=(--mode verify --output output/market-talk-report.json); fi
              if [[ -n "$SLOT_DATE" ]]; then args+=(--slot-date "$SLOT_DATE"); fi
              if [[ -n "$REVISION" ]]; then args+=(--revision "$REVISION"); fi
              if [[ "$LIVE_REQUEST" == true ]]; then export DRY_RUN=false; args+=(--live); fi
              python -m sidestory.market_talk.executor "${args[@]}"
              ;;
            inspect|approve|watch|pause|resume|reconcile|hold)
              args=(--stage "$STAGE" --output output/market-talk-report.json)
              if [[ -n "$REVISION" ]]; then args+=(--revision "$REVISION"); fi
              if [[ -n "$SLOT_DATE" ]]; then args+=(--slot-date "$SLOT_DATE"); fi
              args+=(--confirm "$CONFIRM" --actor "$GITHUB_ACTOR" --note "$NOTE")
              if [[ "$STAGE" == reconcile ]]; then
                if [[ -n "$POST_ID" ]]; then args+=(--post-id "$POST_ID"); fi
                if [[ "$NOT_POSTED" == true ]]; then args+=(--not-posted); fi
              fi
              python -m sidestory.market_talk "${args[@]}"
              ;;
            *) exit 2 ;;
          esac
      - name: Safe operational summary
        if: always()
        run: python -m sidestory.market_talk.reporting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-talk-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/market-talk-report.json
          if-no-files-found: error
