name: Operational Beta - Read Only

on:
  push:
    branches: [main]
    paths:
      - scripts/run_operational_beta.py
      - .github/workflows/operational_beta.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-read-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Production metadata and configuration (no sends or writes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: 'true'
        run: python -m scripts.run_operational_beta
      - name: Upload beta evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-beta-${{ github.sha }}
          path: output/operational-beta.json
          if-no-files-found: error
          retention-days: 14
