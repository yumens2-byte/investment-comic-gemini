name: 🌐 Market Talk (reviewed Facebook text)
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [inspect, approve, publish, automate, verify, watch, pause, resume, reconcile, hold]
        default: inspect
      revision:
        type: string
        default: ''
      confirm:
        description: Type YES for live work or an operator mutation
        type: string
        default: ''
      review_note:
        type: string
        default: ''
      slot_date:
        type: string
        default: ''
      post_id:
        type: string
        default: ''
      not_posted:
        type: boolean
        default: false
  schedule:
    - cron: '7,27,47 4-8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: market-talk-page
  cancel-in-progress: false
jobs:
  market-talk:
    if: github.event_name == 'workflow_dispatch' || vars.MARKET_TALK_SCHEDULE_ENABLED == 'true'
    uses: ./.github/workflows/sidestory_market_talk_execute.yml
    with:
      stage: ${{ github.event_name == 'schedule' && 'automate' || inputs.stage }}
      mode: normal
      live: ${{ github.event_name == 'schedule' || inputs.confirm == 'YES' }}
      revision: ${{ inputs.revision || '' }}
      confirm: ${{ inputs.confirm || '' }}
      review_note: ${{ inputs.review_note || '' }}
      slot_date: ${{ inputs.slot_date || '' }}
      post_id: ${{ inputs.post_id || '' }}
      not_posted: ${{ inputs.not_posted || false }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
      FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
