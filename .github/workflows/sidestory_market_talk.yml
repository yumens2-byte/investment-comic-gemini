name: 🌐 Market Talk (reviewed Facebook text)
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [inspect, approve, publish]
        default: inspect
      revision:
        description: SHA-256 revision (empty inspect checks setup; empty publish selects approved due item)
        type: string
        default: ''
      confirm:
        description: Type YES to approve or publish
        type: string
        default: ''
      review_note:
        description: Evidence, session and canon review result (approve only)
        type: string
        default: ''
  schedule:
    - cron: '30 9 * * 1-5' # KST 18:30 weekdays. No catch-up publishing.
permissions:
  contents: read
concurrency:
  group: facebook-market-talk
  cancel-in-progress: false
jobs:
  market-talk:
    if: github.event_name == 'workflow_dispatch' || vars.MARKET_TALK_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
      FACEBOOK_CONTROL_ENABLED: ${{ vars.FACEBOOK_CONTROL_ENABLED || 'false' }}
      MARKET_TALK_LIVE: ${{ vars.MARKET_TALK_LIVE || 'false' }}
      MARKET_TALK_CHARACTER_IDS: ${{ vars.MARKET_TALK_CHARACTER_IDS }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r sidestory/market_talk/requirements.lock
      - name: Inspect, review or publish exact immutable revision
        env:
          REQUEST_STAGE: ${{ inputs.stage || 'publish' }}
          REQUEST_REVISION: ${{ inputs.revision }}
          REQUEST_CONFIRM: ${{ inputs.confirm }}
          REQUEST_NOTE: ${{ inputs.review_note }}
          REQUEST_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          MARKET_TALK_SCHEDULE_ENABLED: ${{ vars.MARKET_TALK_SCHEDULE_ENABLED || 'false' }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
        shell: bash
        run: |
          args=(--stage "$REQUEST_STAGE" --output output/market-talk-report.json)
          if [[ -n "$REQUEST_REVISION" ]]; then args+=(--revision "$REQUEST_REVISION"); fi
          if [[ "$REQUEST_STAGE" == "approve" ]]; then
            args+=(--confirm "$REQUEST_CONFIRM" --actor "$REQUEST_ACTOR" --note "$REQUEST_NOTE")
          fi
          if [[ "$REQUEST_STAGE" == "publish" ]]; then
            if [[ "$EVENT_NAME" == "schedule" || "$REQUEST_CONFIRM" == "YES" ]]; then
              export DRY_RUN=false
              args+=(--live)
            fi
          fi
          python -m sidestory.market_talk "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-talk-report-${{ github.run_id }}
          path: output/market-talk-report.json
          if-no-files-found: ignore
