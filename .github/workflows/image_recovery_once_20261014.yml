name: Image Recovery 2026-10-14 (approved, image only)
on:
  push:
    branches: [ops/image-recovery-20261014]
permissions:
  contents: read
  actions: read
concurrency:
  group: icg-2026-10-14
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      NOTION_NARRATIVE_SYSTEM_ID: '3439208cbdc3810d9e7ceb5f48f8f093'
      NOTION_NARRATIVE_USER_ID: '3439208cbdc3816bb578d7355b3a1966'
      NOTION_IMAGE_PROMPTS_ID: '3439208cbdc3817191e1c2cccd3865cc'
      NOTION_BATTLE_CONSTANTS_ID: '3439208cbdc3817bbdf9dbdb272508b8'
      NOTION_REF_PROMPTS_ID: '3439208cbdc381ccb85cf8e177a1a3d2'

      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}
      PUBLISH_NON_MAJOR: ${{ secrets.PUBLISH_NON_MAJOR }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      LUNAR_CRUSH_API_KEY: ${{ secrets.LUNAR_CRUSH_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SCHEMA: icg
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TRACKER_DS: '4c08a06f-c1cc-4600-bec4-fb3d018139ff'   # ICG Episode Tracker DB ID (이전 값 485ba577-...은 data source/collection ID로 잘못 입력되어 있었음)
      DRY_RUN: 'false'
      TARGET_DATE: '2026-10-14'
      ICG_GENERATION_REVISION: '2'
      ICG_IMAGE_RETRY_V2_ENABLED: 'false'
      ICG_IMAGE_MAX_RETRIES: '2'
      RUN_STAGE: 'image'
      FORCE_RUN: 'false'
      SCENARIO_V2_ENABLED: ${{ (inputs.scenario_v2 != '' && inputs.scenario_v2 != 'auto') && inputs.scenario_v2 || vars.SCENARIO_V2_ENABLED || 'false' }}
      EPISODE_TYPE_V3_ENABLED: ${{ (inputs.episode_type_v3 != '' && inputs.episode_type_v3 != 'auto') && inputs.episode_type_v3 || vars.EPISODE_TYPE_V3_ENABLED || 'false' }}
      ARC_STATE_V3_ENABLED: ${{ (inputs.arc_state_v3 != '' && inputs.arc_state_v3 != 'auto') && inputs.arc_state_v3 || vars.ARC_STATE_V3_ENABLED || 'false' }}

      # ── Phase 2.3 Feature Flags (하이브리드: inputs > vars > 'false') ──
      # 'auto' 입력 시: vars 값 사용. 'true'/'false' 직접 입력 시: inputs 우선.
      NARRATIVE_DEPTH_ENABLED: ${{ (inputs.narrative_depth != '' && inputs.narrative_depth != 'auto') && inputs.narrative_depth || vars.NARRATIVE_DEPTH_ENABLED || 'false' }}
      PAIR_TENSION_ENABLED: ${{ (inputs.pair_tension != '' && inputs.pair_tension != 'auto') && inputs.pair_tension || vars.PAIR_TENSION_ENABLED || 'false' }}
      CROWD_MODIFIER_ENABLED: ${{ (inputs.crowd_modifier != '' && inputs.crowd_modifier != 'auto') && inputs.crowd_modifier || vars.CROWD_MODIFIER_ENABLED || 'false' }}
      VILLAIN_SIGNATURE_BONUS_ENABLED: ${{ (inputs.villain_signature_bonus != '' && inputs.villain_signature_bonus != 'auto') && inputs.villain_signature_bonus || vars.VILLAIN_SIGNATURE_BONUS_ENABLED || 'false' }}
      EMERGENCE_DEFICIT_ENABLED: ${{ (inputs.emergence_deficit != '' && inputs.emergence_deficit != 'auto') && inputs.emergence_deficit || vars.EMERGENCE_DEFICIT_ENABLED || 'false' }}

      # ── Narrative Context Pilot Flags (inputs > vars > 'false') ─────────
      NARRATIVE_CONTEXT_ENABLED: ${{ (inputs.narrative_context != '' && inputs.narrative_context != 'auto') && inputs.narrative_context || vars.NARRATIVE_CONTEXT_ENABLED || 'false' }}
      STORY_PLANNER_ENABLED: ${{ (inputs.story_planner != '' && inputs.story_planner != 'auto') && inputs.story_planner || vars.STORY_PLANNER_ENABLED || 'false' }}
      CONTINUITY_STRICT_ENABLED: ${{ (inputs.continuity_strict != '' && inputs.continuity_strict != 'auto') && inputs.continuity_strict || vars.CONTINUITY_STRICT_ENABLED || 'false' }}
      SERIAL_NARRATIVE_P0_ENABLED: ${{ vars.SERIAL_NARRATIVE_P0_ENABLED || 'false' }}

      PYTHONPATH: .
      ICG_ROLLOUT_VERSION: narrative-context-story-quality-v2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Initialize private image diagnostics
        run: printf 'ICG_IMAGE_DIAGNOSTICS_DIR=%s/icg-image-diagnostics\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Restore verified P1 to P4 from original run
        uses: actions/download-artifact@v4
        with:
          name: episode-38470953872
          run-id: '38470953872'
          github-token: ${{ github.token }}
          path: output/recovery-source
      - run: python -m scripts.restore_generation_artifact --date 2026-10-14
      - name: Read-only recovery preflight
        run: python -m scripts.run_market --stage image --date 2026-10-14 --preflight-only
      - name: Recover image stage only
        run: python -m scripts.run_market --stage image --date 2026-10-14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_id }}
          path: output/episodes/
          retention-days: 14
