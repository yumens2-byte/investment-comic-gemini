name: 📊 Run Market

on:
  schedule:
    # KST 01:30 월/수 = UTC 16:30 일/화/토
    - cron: '30 16 * * 1-6'
  workflow_dispatch:
    inputs:
      target_date:
        description: '실행 대상 날짜 (YYYY-MM-DD, 미입력 시 오늘)'
        required: false
        default: ''
      force:
        description: '공휴일/주말 강제 실행 여부 (true/false)'
        required: false
        default: 'false'
      stage:
        description: '실행 단계 (all/data/analysis/narrative/persist/image)'
        required: false
        default: 'all'
      scenario_v2:
        description: 'Scenario v2.0 활성화 (true=Shadow Run / false=기존 로직)'
        required: false
        default: 'false'

      # [inputs 블록 — scenario_v2 아래]
      episode_type_v3:
        description: 'Episode Type v3 활성화 (9종 타입 / false=기존 3종 로직)'
        required: false
        default: 'false'

      # ── Phase 2.3 Feature Flags (2026-05-15) ──────────────────────────
      # 미입력 시: Repository Variables(vars.*) → 'false' 순서로 fallback
      # 운영 점진 ON은 Repository Variables에서 설정 권장
      narrative_depth:
        description: 'G01+G02 Belief Sheet (true/false/auto)'
        required: false
        default: 'auto'
      pair_tension:
        description: 'G03+G05 Pair Tension trigger (true/false/auto)'
        required: false
        default: 'auto'
      crowd_modifier:
        description: 'G08 Crowd Momentum modifier (true/false/auto)'
        required: false
        default: 'auto'
      villain_signature_bonus:
        description: 'G09 Villain Signature Bonus (true/false/auto)'
        required: false
        default: 'auto'
      emergence_deficit:
        description: 'G09 Emergence Information Deficit (true/false/auto)'
        required: false
        default: 'auto'

permissions:
  contents: read
  actions: write

concurrency:
  group: icg-${{ github.event.inputs.target_date || 'today' }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: ICG Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Seoul
      NOTION_NARRATIVE_SYSTEM_ID: '3439208cbdc3810d9e7ceb5f48f8f093'
      NOTION_NARRATIVE_USER_ID: '3439208cbdc3816bb578d7355b3a1966'
      NOTION_IMAGE_PROMPTS_ID: '3439208cbdc3817191e1c2cccd3865cc'
      NOTION_BATTLE_CONSTANTS_ID: '3439208cbdc3817bbdf9dbdb272508b8'
      NOTION_REF_PROMPTS_ID: '3439208cbdc381ccb85cf8e177a1a3d2'

      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}
      PUBLISH_NON_MAJOR : ${{ secrets.PUBLISH_NON_MAJOR }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      LUNAR_CRUSH_API_KEY: ${{ secrets.LUNAR_CRUSH_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SCHEMA: icg
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TRACKER_DS: '485ba577-0512-45fd-9445-b9e86c53d88b'
      DRY_RUN: 'false'
      FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
      SCENARIO_V2_ENABLED: ${{ github.event.inputs.scenario_v2 || 'false' }}
      EPISODE_TYPE_V3_ENABLED: ${{ github.event.inputs.episode_type_v3 || 'false' }}

      # ── Phase 2.3 Feature Flags (하이브리드: inputs > vars > 'false') ──
      # 'auto' 입력 시: vars 값 사용. 'true'/'false' 직접 입력 시: inputs 우선.
      NARRATIVE_DEPTH_ENABLED: ${{ (github.event.inputs.narrative_depth != '' && github.event.inputs.narrative_depth != 'auto') && github.event.inputs.narrative_depth || vars.NARRATIVE_DEPTH_ENABLED || 'false' }}
      PAIR_TENSION_ENABLED: ${{ (github.event.inputs.pair_tension != '' && github.event.inputs.pair_tension != 'auto') && github.event.inputs.pair_tension || vars.PAIR_TENSION_ENABLED || 'false' }}
      CROWD_MODIFIER_ENABLED: ${{ (github.event.inputs.crowd_modifier != '' && github.event.inputs.crowd_modifier != 'auto') && github.event.inputs.crowd_modifier || vars.CROWD_MODIFIER_ENABLED || 'false' }}
      VILLAIN_SIGNATURE_BONUS_ENABLED: ${{ (github.event.inputs.villain_signature_bonus != '' && github.event.inputs.villain_signature_bonus != 'auto') && github.event.inputs.villain_signature_bonus || vars.VILLAIN_SIGNATURE_BONUS_ENABLED || 'false' }}
      EMERGENCE_DEFICIT_ENABLED: ${{ (github.event.inputs.emergence_deficit != '' && github.event.inputs.emergence_deficit != 'auto') && github.event.inputs.emergence_deficit || vars.EMERGENCE_DEFICIT_ENABLED || 'false' }}

      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install CJK fonts (PIL 한국어 렌더링)
        run: sudo apt-get install -y fonts-noto-cjk --no-install-recommends -q

      - name: STEP 2 — Data Ingest
        if: ${{ github.event.inputs.stage == '' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'data' }}
        run: |
          python -m scripts.run_market \
            --stage data \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}

      - name: STEP 3 — Analysis
        if: ${{ github.event.inputs.stage == '' || github.event.inputs.stage == 'all' || github.event.inputs.stage == 'analysis' }}
        run: |
          python -m scripts.run_market \
            --stage analysis \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}


      - name: STEP 3.5 — Major Event Gate (for cost control)
        id: major_gate
        if: ${{ github.event_name == 'schedule' && (github.event.inputs.stage == '' || github.event.inputs.stage == 'all') }}
        run: |
          TARGET_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(TZ=Asia/Seoul date +%F)
          fi
          python -m scripts.check_major_event_gate --date "$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: STEP 4 — Narrative (Claude)
        if: ${{ github.event.inputs.stage == 'narrative' || (github.event.inputs.stage == '' || github.event.inputs.stage == 'all') && (github.event_name != 'schedule' || steps.major_gate.outputs.should_run_expensive == 'true') }}
        run: |
          echo "🎛️  Phase 2.3 Feature Flags:"
          echo "  NARRATIVE_DEPTH_ENABLED        = ${NARRATIVE_DEPTH_ENABLED}"
          echo "  PAIR_TENSION_ENABLED           = ${PAIR_TENSION_ENABLED}"
          echo "  CROWD_MODIFIER_ENABLED         = ${CROWD_MODIFIER_ENABLED}"
          echo "  VILLAIN_SIGNATURE_BONUS_ENABLED = ${VILLAIN_SIGNATURE_BONUS_ENABLED}"
          echo "  EMERGENCE_DEFICIT_ENABLED      = ${EMERGENCE_DEFICIT_ENABLED}"
          python -m scripts.run_market \
            --stage narrative \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}

      - name: STEP 5 — Persist
        if: ${{ github.event.inputs.stage == 'persist' || (github.event.inputs.stage == '' || github.event.inputs.stage == 'all') && (github.event_name != 'schedule' || steps.major_gate.outputs.should_run_expensive == 'true') }}
        run: |
          python -m scripts.run_market \
            --stage persist \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}

      - name: STEP 6 — Image Generation (Gemini)
        if: ${{ github.event.inputs.stage == 'image' || (github.event.inputs.stage == '' || github.event.inputs.stage == 'all') && (github.event_name != 'schedule' || steps.major_gate.outputs.should_run_expensive == 'true') }}
        run: |
          python -m scripts.run_market \
            --stage image \
            ${{ github.event.inputs.target_date && format('--date {0}', github.event.inputs.target_date) || '' }}

      - name: PAUSE — Dialog Gate
        run: |
          echo "✅ STEP 2~6 완료."
          echo "📝 schedule 실행: resume_episode.yml이 KST 05:00에 자동 실행됩니다."
          echo "🔰 SCENARIO_V2_ENABLED=${{ env.SCENARIO_V2_ENABLED }}"

      - name: Upload Episode Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_id }}
          path: output/episodes/
          retention-days: 14

      - name: Notify Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
        run: python -m scripts.notify_failure
