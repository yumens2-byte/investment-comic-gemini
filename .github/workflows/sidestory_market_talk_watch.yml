name: 🌐 Market Talk slot watcher
on:
  workflow_dispatch:
    inputs:
      slot_date:
        description: Optional KST YYYY-MM-DD completed weekday
        type: string
        default: ''
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
      DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --require-hashes -r sidestory/market_talk/requirements.lock
      - name: Read-only slot completion check
        env:
          REQUEST_SLOT_DATE: ${{ inputs.slot_date }}
        run: |
          args=(--stage watch --output output/market-talk-report.json)
          if [[ -n "$REQUEST_SLOT_DATE" ]]; then args+=(--slot-date "$REQUEST_SLOT_DATE"); fi
          python -m sidestory.market_talk "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-talk-watch-${{ github.run_id }}
          path: output/market-talk-report.json
          if-no-files-found: error
