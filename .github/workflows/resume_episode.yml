name: 🔄 Resume Episode

on:
  schedule:
    # KST 05:00 월/수 = UTC 20:00 일/화/토
    - cron: '6 20 * * 0-5'
  workflow_dispatch:
    inputs:
      episode_id:
        description: '에피소드 ID (예: ICG-2026-04-14-001). 미입력 시 최신 재처리 가능 에피소드 자동 선택.'
        required: false
        default: ''
      force:
        description: '기존 assembled 상태 재조립 허용 (true/false)'
        required: false
        default: 'false'
      allow_narrative_only:
        description: '이미지 생성 전 narrative_done 상태 조립 허용 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: read

jobs:
  resume:
    name: Resume — PIL Assembly
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      # ── Notion 보안 분리 Page ID ─────────────────────────────────────────
      NOTION_NARRATIVE_SYSTEM_ID: '3439208cbdc3810d9e7ceb5f48f8f093'
      NOTION_NARRATIVE_USER_ID:   '3439208cbdc3816bb578d7355b3a1966'
      NOTION_IMAGE_PROMPTS_ID:    '3439208cbdc3817191e1c2cccd3865cc'
      NOTION_BATTLE_CONSTANTS_ID: '3439208cbdc3817bbdf9dbdb272508b8'
      NOTION_REF_PROMPTS_ID:      '3439208cbdc381ccb85cf8e177a1a3d2'
      # ── Secrets ──────────────────────────────────────────────────────────
      PYTHONPATH: .
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}
      PUBLISH_NON_MAJOR: ${{ secrets.PUBLISH_NON_MAJOR }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      LUNAR_CRUSH_API_KEY: ${{ secrets.LUNAR_CRUSH_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
      TELEGRAM_PAID_CHANNEL_ID: ${{ secrets.TELEGRAM_PAID_CHANNEL_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      DRY_RUN: ${{ secrets.DRY_RUN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CJK fonts (PIL 한국어 렌더링)
        run: sudo apt-get install -y fonts-noto-cjk --no-install-recommends -q

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve exact Resume target (read only)
        id: fetch_run_id
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
          REQUEST_FORCE: ${{ inputs.force }}
          REQUEST_NARRATIVE_ONLY: ${{ inputs.allow_narrative_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--prepare-only)
          if [[ -n "$EPISODE_ID" ]]; then args+=(--episode "$EPISODE_ID"); fi
          if [[ "$REQUEST_FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$REQUEST_NARRATIVE_ONLY" == "true" ]]; then args+=(--allow-narrative-only); fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then args+=(--scheduled); fi
          python -m scripts.run_resume "${args[@]}"

      - name: Download Episode Artifact (from Run Market)
        if: steps.fetch_run_id.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: episode-${{ steps.fetch_run_id.outputs.run_id }}
          path: output/episodes/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.fetch_run_id.outputs.run_id }}

      - name: STEP 7 — Assembly
        if: steps.fetch_run_id.outputs.ready == 'true'
        env:
          EPISODE_ID: ${{ steps.fetch_run_id.outputs.episode_id }}
          REQUEST_FORCE: ${{ inputs.force }}
          REQUEST_NARRATIVE_ONLY: ${{ inputs.allow_narrative_only }}
        run: |
          args=(--episode "$EPISODE_ID")
          if [[ "$REQUEST_FORCE" == "true" ]]; then args+=(--force); fi
          if [[ "$REQUEST_NARRATIVE_ONLY" == "true" ]]; then args+=(--allow-narrative-only); fi
          python -m scripts.run_resume "${args[@]}"

      - name: Upload Assembled Slides
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.fetch_run_id.outputs.ready == 'true' }}
        with:
          name: slides-${{ inputs.episode_id || 'latest' }}
          path: output/episodes/
          retention-days: 14

      - name: Notify Content QC Warnings
        if: ${{ always() && steps.fetch_run_id.outputs.ready == 'true' && env.DRY_RUN != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
        run: python -m scripts.notify_failure --qc-warnings

      - name: Notify Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_FREE_CHANNEL_ID: ${{ secrets.TELEGRAM_FREE_CHANNEL_ID }}
        run: python -m scripts.notify_failure
