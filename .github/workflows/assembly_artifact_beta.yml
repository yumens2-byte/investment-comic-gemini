name: Assembly Artifact Recovery Beta
on:
  push:
    branches: [main]
    paths:
      - engine/assembly/pil_composer.py
      - scripts/run_resume.py
      - scripts/run_assembly_artifact_beta.py
      - scripts/prepare_assembly_beta.py
      - .github/workflows/assembly_artifact_beta.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  artifact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Resolve available source artifact (read only)
        id: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.prepare_assembly_beta
      - uses: actions/download-artifact@v4
        with:
          name: episode-${{ steps.source.outputs.run_id }}
          path: output/episodes/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Replay approved source without publication
        env:
          SOURCE_EPISODE: ${{ steps.source.outputs.episode_id }}
        run: python -m scripts.run_assembly_artifact_beta --episode "$SOURCE_EPISODE" --script "$RUNNER_TEMP/assembly-beta-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: assembly-replay-${{ steps.source.outputs.episode_id }}-${{ github.run_id }}
          path: output/assembly-beta/
          if-no-files-found: error
          retention-days: 14
