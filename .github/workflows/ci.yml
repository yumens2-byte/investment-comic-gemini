name: ✅ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image-attempt-diagnostics-contract:
    name: Image Attempt Diagnostics Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/icg-sql-contract" --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify ordinary diagnostics permissions and settlement contracts
        run: |
          export PGLITE_MODULE_PATH="$RUNNER_TEMP/icg-sql-contract/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/integration/image_attempt_diagnostics_sql.mjs
  narrative-database-contract:
    name: Narrative Database Contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-contract-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'psycopg[binary]==3.3.6'
      - run: python scripts/test_narrative_database_contract.py
        env:
          DATABASE_TEST_URL: postgresql://postgres:local-contract-test@localhost:5432/postgres
      - run: python scripts/test_image_recovery_database_contract.py
        env:
          DATABASE_TEST_URL: postgresql://postgres:local-contract-test@localhost:5432/postgres
  publication-postgrest-contract:
    name: Publication PostgREST Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-contract-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      DRY_RUN: 'true'
      DATABASE_TEST_URL: postgresql://postgres:local-contract-test@localhost:5432/postgres
      POSTGREST_TEST_URL: http://localhost:53000
      POSTGREST_TEST_JWT_SECRET: local-contract-test-secret-at-least-32-chars
      AUTHENTICATOR_TEST_PASSWORD: local-authenticator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt 'psycopg[binary]==3.3.6'
      - name: Download PostgREST (local, test credentials only)
        run: |
          curl -fsSL -o /tmp/postgrest.tar.xz \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xf /tmp/postgrest.tar.xz -C /tmp
      # The test starts PostgREST itself after creating the roles and schema.
      - run: python scripts/test_publication_postgrest_contract.py
        env:
          POSTGREST_BIN: /tmp/postgrest
      - if: failure()
        run: cat /tmp/postgrest.log
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONPATH: .
      # Unit and regression tests use mocked adapters, never production credentials.
      DRY_RUN: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install media test dependencies
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Avoid the Azure mirror that stalled the 2026-10-01 main CI.
            for SOURCE in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$SOURCE" ]; then
                sudo sed -E -i 's|https?://azure[.]archive[.]ubuntu[.]com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$SOURCE"
                if grep -Fq 'azure.archive.ubuntu.com' "$SOURCE"; then
                  echo "Azure Ubuntu mirror remains configured; refusing installation."
                  exit 1
                fi
              fi
            done
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check . --line-length=100

      - name: Test (pytest)
        run: python -m pytest tests/ -v
